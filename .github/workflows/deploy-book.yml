name: Deploy Evenec Book

on:
  push:
    branches:
      - main
      - release/v1.0

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Check Quarto
        run: |
          cd books/interview-bible
          quarto check

      - name: Render Book
        run: |
          cd books/interview-bible
          quarto render

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: books/interview-bible/_book

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

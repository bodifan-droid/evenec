<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="788"
     viewBox="0 0 1400 788">

  <defs>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:700;fill:#1E3A8A;}
      .subtitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:22px;font-weight:700;fill:#12C6B2;}
      .header{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;font-weight:700;fill:#1E3A8A;}
      .cell{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;fill:#1E3A8A;}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px;fill:#1E3A8A;}
      .step{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:700;fill:#1E3A8A;}
      .num{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:700;fill:white;}
    </style>

    <marker id="arrow"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#12C6B2"/>
    </marker>
  </defs>

  <rect width="1400" height="788" rx="28" fill="white"/>

  <text x="60" y="70" class="subtitle">SQL-03</text>
  <text x="60" y="120" class="title">Window Functions</text>

  <!-- Flow -->

  <g transform="translate(70,170)">

    <!-- Step 1 -->

    <circle cx="40" cy="-25" r="18" fill="#12C6B2"/>
    <text x="40" y="-18" text-anchor="middle" class="num">1</text>

    <text x="70" y="-18" class="step">PARTITION BY</text>

    <text x="70" y="12" class="small">Split the data into separate groups.</text>

    <line x1="280" y1="-18" x2="350" y2="-18"
          stroke="#12C6B2" stroke-width="3"
          marker-end="url(#arrow)"/>

    <!-- Step 2 -->

    <circle cx="390" cy="-25" r="18" fill="#12C6B2"/>
    <text x="390" y="-18" text-anchor="middle" class="num">2</text>

    <text x="420" y="-18" class="step">ORDER BY</text>

    <text x="420" y="12" class="small">Sort rows inside each group.</text>

    <line x1="640" y1="-18" x2="710" y2="-18"
          stroke="#12C6B2" stroke-width="3"
          marker-end="url(#arrow)"/>

    <!-- Step 3 -->

    <circle cx="750" cy="-25" r="18" fill="#12C6B2"/>
    <text x="750" y="-18" text-anchor="middle" class="num">3</text>

    <text x="780" y="-18" class="step">ROW_NUMBER()</text>

    <text x="780" y="12" class="small">Assign a sequential number.</text>

  </g>

  <!-- Table -->

  <g transform="translate(150,270)">

    <rect width="1100"
          height="360"
          rx="20"
          fill="white"
          stroke="#D6DCE8"
          stroke-width="2"/>

    <!-- Header -->

    <rect width="1100"
          height="58"
          rx="20"
          fill="#F8FAFC"/>

    <line x1="220" y1="0" x2="220" y2="360" stroke="#E5E7EB"/>
    <line x1="430" y1="0" x2="430" y2="360" stroke="#E5E7EB"/>
    <line x1="640" y1="0" x2="640" y2="360" stroke="#E5E7EB"/>
    <line x1="860" y1="0" x2="860" y2="360" stroke="#E5E7EB"/>

    <text x="110" y="36" text-anchor="middle" class="header">Employee</text>
    <text x="325" y="36" text-anchor="middle" class="header">Department</text>
    <text x="535" y="36" text-anchor="middle" class="header">Salary</text>
    <text x="750" y="36" text-anchor="middle" class="header">ROW_NUMBER</text>
    <text x="980" y="36" text-anchor="middle" class="header">RANK</text>

    <!-- Blue group highlight -->

    <rect x="220" y="58"
          width="210"
          height="150"
          fill="#ECFEFB"/>

    <!-- Green group highlight -->

    <rect x="220" y="208"
          width="210"
          height="150"
          fill="#ECFEFB"/>

    <!-- Horizontal lines -->

    <line x1="0" y1="108" x2="1100" y2="108" stroke="#E5E7EB"/>
    <line x1="0" y1="158" x2="1100" y2="158" stroke="#E5E7EB"/>
    <line x1="0" y1="208" x2="1100" y2="208" stroke="#E5E7EB"/>
    <line x1="0" y1="258" x2="1100" y2="258" stroke="#E5E7EB"/>
    <line x1="0" y1="308" x2="1100" y2="308" stroke="#E5E7EB"/>

    <!-- Rows -->

    <text x="110" y="90" text-anchor="middle" class="cell">Alice</text>
    <text x="325" y="90" text-anchor="middle" class="cell">Sales</text>
    <text x="535" y="90" text-anchor="middle" class="cell">£72k</text>
    <text x="750" y="90" text-anchor="middle" class="cell">1</text>
    <text x="980" y="90" text-anchor="middle" class="cell">1</text>

    <text x="110" y="140" text-anchor="middle" class="cell">Bob</text>
    <text x="325" y="140" text-anchor="middle" class="cell">Sales</text>
    <text x="535" y="140" text-anchor="middle" class="cell">£68k</text>
    <text x="750" y="140" text-anchor="middle" class="cell">2</text>
    <text x="980" y="140" text-anchor="middle" class="cell">2</text>

    <text x="110" y="190" text-anchor="middle" class="cell">Carol</text>
    <text x="325" y="190" text-anchor="middle" class="cell">Sales</text>
    <text x="535" y="190" text-anchor="middle" class="cell">£68k</text>
    <text x="750" y="190" text-anchor="middle" class="cell">3</text>
    <text x="980" y="190" text-anchor="middle" class="cell">2</text>

    <text x="110" y="240" text-anchor="middle" class="cell">David</text>
    <text x="325" y="240" text-anchor="middle" class="cell">Marketing</text>
    <text x="535" y="240" text-anchor="middle" class="cell">£65k</text>
    <text x="750" y="240" text-anchor="middle" class="cell">1</text>
    <text x="980" y="240" text-anchor="middle" class="cell">1</text>

    <text x="110" y="290" text-anchor="middle" class="cell">Emma</text>
    <text x="325" y="290" text-anchor="middle" class="cell">Marketing</text>
    <text x="535" y="290" text-anchor="middle" class="cell">£61k</text>
    <text x="750" y="290" text-anchor="middle" class="cell">2</text>
    <text x="980" y="290" text-anchor="middle" class="cell">2</text>

    <text x="110" y="340" text-anchor="middle" class="cell">Frank</text>
    <text x="325" y="340" text-anchor="middle" class="cell">Marketing</text>
    <text x="535" y="340" text-anchor="middle" class="cell">£61k</text>
    <text x="750" y="340" text-anchor="middle" class="cell">3</text>
    <text x="980" y="340" text-anchor="middle" class="cell">2</text>

  </g>

  <!-- Bottom cards -->

  <g transform="translate(160,660)">

    <rect width="320" height="90" rx="18"
          fill="white"
          stroke="#D6DCE8"
          stroke-width="2"/>

    <text x="160" y="36" text-anchor="middle" class="header">ROW_NUMBER()</text>
    <text x="160" y="66" text-anchor="middle" class="small">Always unique: 1,2,3…</text>

    <g transform="translate(380,0)">

      <rect width="320" height="90" rx="18"
            fill="white"
            stroke="#D6DCE8"
            stroke-width="2"/>

      <text x="160" y="36" text-anchor="middle" class="header">RANK()</text>
      <text x="160" y="66" text-anchor="middle" class="small">Ties share the same rank.</text>

    </g>

    <g transform="translate(760,0)">

      <rect width="320" height="90" rx="18"
            fill="white"
            stroke="#D6DCE8"
            stroke-width="2"/>

      <text x="160" y="36" text-anchor="middle" class="header">DENSE_RANK()</text>
      <text x="160" y="66" text-anchor="middle" class="small">No gaps after ties.</text>

    </g>

  </g>

</svg>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="788"
     viewBox="0 0 1400 788">

<defs>

<style>
.title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:700;fill:#1E3A8A;}
.subtitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:22px;font-weight:700;fill:#12C6B2;}
.boxTitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:22px;font-weight:700;fill:#1E3A8A;}
.small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px;fill:#1E3A8A;}
.num{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:700;fill:white;}
</style>

<marker id="arrow"
        markerWidth="12"
        markerHeight="12"
        refX="10"
        refY="6"
        orient="auto">
  <path d="M0,0 L12,6 L0,12 Z" fill="#12C6B2"/>
</marker>

</defs>

<rect width="1400" height="788" rx="28" fill="white"/>

<text x="60" y="70" class="subtitle">EXCEL-02</text>
<text x="60" y="120" class="title">Pivot Table Workflow</text>

<!-- STEP 1 -->

<g transform="translate(70,180)">

<circle cx="35" cy="-22" r="18" fill="#12C6B2"/>
<text x="35" y="-15" text-anchor="middle" class="num">1</text>

<rect width="230" height="420" rx="20"
      fill="white"
      stroke="#D6DCE8"
      stroke-width="2"/>

<text x="115" y="36" text-anchor="middle" class="boxTitle">Raw Data</text>

<!-- grid -->

<g transform="translate(25,70)">
<rect width="180" height="280" fill="#F8FAFC" stroke="#E5E7EB"/>
<line x1="45" y1="0" x2="45" y2="280" stroke="#E5E7EB"/>
<line x1="90" y1="0" x2="90" y2="280" stroke="#E5E7EB"/>
<line x1="135" y1="0" x2="135" y2="280" stroke="#E5E7EB"/>
<line x1="0" y1="35" x2="180" y2="35" stroke="#E5E7EB"/>
<line x1="0" y1="70" x2="180" y2="70" stroke="#E5E7EB"/>
<line x1="0" y1="105" x2="180" y2="105" stroke="#E5E7EB"/>
<line x1="0" y1="140" x2="180" y2="140" stroke="#E5E7EB"/>
<line x1="0" y1="175" x2="180" y2="175" stroke="#E5E7EB"/>
<line x1="0" y1="210" x2="180" y2="210" stroke="#E5E7EB"/>
<line x1="0" y1="245" x2="180" y2="245" stroke="#E5E7EB"/>

<rect width="180" height="35" fill="#ECFEFB"/>
</g>

<text x="115" y="380" text-anchor="middle" class="small">Clean rows</text>
<text x="115" y="404" text-anchor="middle" class="small">One row = one record</text>

</g>

<!-- Arrow -->

<line x1="300" y1="390" x2="360" y2="390"
      stroke="#12C6B2"
      stroke-width="3"
      marker-end="url(#arrow)"/>

<!-- STEP 2 -->

<g transform="translate(380,180)">

<circle cx="35" cy="-22" r="18" fill="#12C6B2"/>
<text x="35" y="-15" text-anchor="middle" class="num">2</text>

<rect width="290" height="420" rx="20"
      fill="white"
      stroke="#D6DCE8"
      stroke-width="2"/>

<text x="145" y="36" text-anchor="middle" class="boxTitle">Build Pivot</text>

<!-- Pivot Areas -->

<g transform="translate(25,70)">

<rect width="240" height="70" rx="12"
      fill="#ECFEFB"
      stroke="#12C6B2"/>

<text x="120" y="42"
      text-anchor="middle"
      class="small">Rows: Category</text>

<rect y="90"
      width="240"
      height="70"
      rx="12"
      fill="white"
      stroke="#D6DCE8"/>

<text x="120" y="132"
      text-anchor="middle"
      class="small">Columns: Month</text>

<rect y="180"
      width="240"
      height="70"
      rx="12"
      fill="white"
      stroke="#D6DCE8"/>

<text x="120" y="222"
      text-anchor="middle"
      class="small">Values: Sales</text>

<rect y="270"
      width="240"
      height="70"
      rx="12"
      fill="white"
      stroke="#D6DCE8"/>

<text x="120" y="312"
      text-anchor="middle"
      class="small">Filters: Region</text>

</g>

</g>

<!-- Arrow -->

<line x1="690" y1="390" x2="750" y2="390"
      stroke="#12C6B2"
      stroke-width="3"
      marker-end="url(#arrow)"/>

<!-- STEP 3 -->

<g transform="translate(770,180)">

<circle cx="35" cy="-22" r="18" fill="#12C6B2"/>
<text x="35" y="-15" text-anchor="middle" class="num">3</text>

<rect width="560" height="420" rx="20"
      fill="white"
      stroke="#D6DCE8"
      stroke-width="2"/>

<text x="280" y="36"
      text-anchor="middle"
      class="boxTitle">Interactive Report</text>

<!-- KPI -->

<g transform="translate(35,70)">

<rect width="150" height="70" rx="14"
      fill="#ECFEFB"
      stroke="#12C6B2"/>

<text x="75" y="28"
      text-anchor="middle"
      class="small">Revenue</text>

<text x="75" y="50"
      text-anchor="middle"
      class="boxTitle">£245k</text>

<rect x="175" width="150" height="70" rx="14"
      fill="white"
      stroke="#D6DCE8"/>

<text x="250" y="28"
      text-anchor="middle"
      class="small">Orders</text>

<text x="250" y="50"
      text-anchor="middle"
      class="boxTitle">4,820</text>

<rect x="350" width="150" height="70" rx="14"
      fill="white"
      stroke="#D6DCE8"/>

<text x="425" y="28"
      text-anchor="middle"
      class="small">Avg Order</text>

<text x="425" y="50"
      text-anchor="middle"
      class="boxTitle">£51</text>

</g>

<!-- Pivot table -->

<g transform="translate(35,170)">

<rect width="330" height="170"
      fill="#F8FAFC"
      stroke="#E5E7EB"/>

<rect width="330" height="35"
      fill="#ECFEFB"/>

<line x1="110" y1="0" x2="110" y2="170" stroke="#E5E7EB"/>
<line x1="220" y1="0" x2="220" y2="170" stroke="#E5E7EB"/>

<line x1="0" y1="35" x2="330" y2="35" stroke="#E5E7EB"/>
<line x1="0" y1="70" x2="330" y2="70" stroke="#E5E7EB"/>
<line x1="0" y1="105" x2="330" y2="105" stroke="#E5E7EB"/>
<line x1="0" y1="140" x2="330" y2="140" stroke="#E5E7EB"/>

</g>

<!-- Slicers -->

<g transform="translate(390,170)">

<rect width="135" height="50"
      rx="12"
      fill="#ECFEFB"
      stroke="#12C6B2"/>

<text x="67" y="31"
      text-anchor="middle"
      class="small">London</text>

<rect y="65"
      width="135"
      height="50"
      rx="12"
      fill="white"
      stroke="#D6DCE8"/>

<text x="67" y="96"
      text-anchor="middle"
      class="small">Manchester</text>

<rect y="130"
      width="135"
      height="50"
      rx="12"
      fill="white"
      stroke="#D6DCE8"/>

<text x="67" y="161"
      text-anchor="middle"
      class="small">Birmingham</text>

</g>

<text x="280"
      y="382"
      text-anchor="middle"
      class="small">Filter → Explore → Explain</text>

</g>

</svg>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="788"
     viewBox="0 0 1400 788">

  <defs>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:700;fill:#1E3A8A;}
      .subtitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:21px;font-weight:500;fill:#475569;}
      .section{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:700;fill:#1E3A8A;}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:16px;fill:#475569;}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;fill:#64748B;}
    </style>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#12C6B2"/>
    </marker>
  </defs>

  <rect width="1400" height="788" rx="28" fill="#F8FAFC"/>

  <!-- Header -->
  <text x="50" y="60" class="title">Professional Dashboard Layout</text>
  <text x="50" y="94" class="subtitle">Where every component belongs on an executive dashboard</text>
  <line x1="50" y1="112" x2="1350" y2="112" stroke="#12C6B2" stroke-width="3"/>

  <!-- KPI Row -->
  <g>
    <g transform="translate(80,140)">
      <rect x="4" y="4" width="240" height="90" rx="18" fill="#0F172A" opacity="0.08"/>
      <rect width="240" height="90" rx="18" fill="white"/>
      <text x="22" y="34" class="section">KPI Cards</text>
      <text x="22" y="58" class="label">Revenue</text>
      <text x="170" y="58" class="label">📈</text>
    </g>

    <g transform="translate(350,140)">
      <rect x="4" y="4" width="240" height="90" rx="18" fill="#0F172A" opacity="0.08"/>
      <rect width="240" height="90" rx="18" fill="white"/>
      <text x="22" y="34" class="section">Orders</text>
      <text x="170" y="58" class="label">🧾</text>
    </g>

    <g transform="translate(620,140)">
      <rect x="4" y="4" width="240" height="90" rx="18" fill="#0F172A" opacity="0.08"/>
      <rect width="240" height="90" rx="18" fill="white"/>
      <text x="22" y="34" class="section">Average Order</text>
      <text x="170" y="58" class="label">£</text>
    </g>

    <g transform="translate(890,140)">
      <rect x="4" y="4" width="240" height="90" rx="18" fill="#0F172A" opacity="0.08"/>
      <rect width="240" height="90" rx="18" fill="white"/>
      <text x="22" y="34" class="section">Top City</text>
      <text x="170" y="58" class="label">📍</text>
    </g>
  </g>

  <!-- Filters -->
  <g>
    <g transform="translate(70,260)">
      <rect x="4" y="4" width="230" height="410" rx="20" fill="#0F172A" opacity="0.08"/>
      <rect width="230" height="410" rx="20" fill="white"/>
      <text x="24" y="36" class="section">Filters</text>

      <g transform="translate(24,70)">
        <text y="0" class="label">City</text>
        <rect y="10" width="182" height="34" rx="8" fill="white" stroke="#CBD5E1"/>

        <text y="72" class="label">Category</text>
        <rect y="82" width="182" height="34" rx="8" fill="white" stroke="#CBD5E1"/>

        <text y="144" class="label">Segment</text>
        <rect y="154" width="182" height="34" rx="8" fill="white" stroke="#CBD5E1"/>

        <text y="216" class="label">Channel</text>
        <rect y="226" width="182" height="34" rx="8" fill="white" stroke="#CBD5E1"/>

        <text y="288" class="label">Timeline</text>
        <line x1="10" y1="320" x2="170" y2="320" stroke="#1E3A8A" stroke-width="4"/>
        <circle cx="30" cy="320" r="10" fill="white" stroke="#1E3A8A" stroke-width="3"/>
        <circle cx="150" cy="320" r="10" fill="white" stroke="#1E3A8A" stroke-width="3"/>
      </g>
    </g>
  </g>

  <!-- Main Chart -->
  <g>
    <g transform="translate(330,260)">
      <rect x="4" y="4" width="650" height="230" rx="20" fill="#0F172A" opacity="0.08"/>
      <rect width="650" height="230" rx="20" fill="white"/>
      <text x="24" y="36" class="section">Primary Chart</text>
      <text x="24" y="58" class="small">Answer the biggest business question first.</text>

      <line x1="60" y1="70" x2="60" y2="180" stroke="#CBD5E1"/>
      <line x1="60" y1="180" x2="600" y2="180" stroke="#CBD5E1"/>

      <g fill="#12C6B2">
        <rect x="95" y="90" width="45" height="90" rx="6"/>
        <rect x="175" y="75" width="45" height="105" rx="6"/>
        <rect x="255" y="105" width="45" height="75" rx="6"/>
        <rect x="335" y="60" width="45" height="120" rx="6"/>
        <rect x="415" y="115" width="45" height="65" rx="6"/>
      </g>
    </g>
  </g>

  <!-- Secondary Chart -->
  <g>
    <g transform="translate(1010,260)">
      <rect x="4" y="4" width="300" height="230" rx="20" fill="#0F172A" opacity="0.08"/>
      <rect width="300" height="230" rx="20" fill="white"/>
      <text x="24" y="36" class="section">Secondary Chart</text>
      <text x="24" y="58" class="small">Break down the main result.</text>

      <circle cx="145" cy="128" r="65" fill="none" stroke="#1E3A8A" stroke-width="28" stroke-dasharray="120 288" transform="rotate(-90 145 128)"/>
      <circle cx="145" cy="128" r="65" fill="none" stroke="#2563EB" stroke-width="28" stroke-dasharray="85 323" stroke-dashoffset="-120" transform="rotate(-90 145 128)"/>
      <circle cx="145" cy="128" r="65" fill="none" stroke="#12C6B2" stroke-width="28" stroke-dasharray="55 353" stroke-dashoffset="-205" transform="rotate(-90 145 128)"/>
      <circle cx="145" cy="128" r="40" fill="white"/>
    </g>
  </g>

  <!-- Trend -->
  <g>
    <g transform="translate(330,520)">
      <rect x="4" y="4" width="650" height="150" rx="20" fill="#0F172A" opacity="0.08"/>
      <rect width="650" height="150" rx="20" fill="white"/>
      <text x="24" y="34" class="section">Trend Analysis</text>

      <line x1="60" y1="45" x2="60" y2="120" stroke="#CBD5E1"/>
      <line x1="60" y1="120" x2="600" y2="120" stroke="#CBD5E1"/>

      <polyline fill="none" stroke="#12C6B2" stroke-width="4"
        points="70,105 120,80 170,85 220,65 270,90 320,72 370,50 420,78 470,62 520,86 570,70"/>
    </g>
  </g>

  <!-- Detail -->
  <g>
    <g transform="translate(1010,520)">
      <rect x="4" y="4" width="300" height="150" rx="20" fill="#0F172A" opacity="0.08"/>
      <rect width="300" height="150" rx="20" fill="white"/>
      <text x="24" y="34" class="section">Detail Panel</text>
      <text x="24" y="58" class="small">Top Products</text>

      <g fill="#12C6B2">
        <rect x="24" y="72" width="190" height="12" rx="6"/>
        <rect x="24" y="94" width="160" height="12" rx="6"/>
        <rect x="24" y="116" width="120" height="12" rx="6"/>
      </g>
    </g>
  </g>

  <!-- Eye Flow -->
  <g stroke="#12C6B2" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 8">
    <path d="M180 245 C260 240 420 235 520 240"/>
    <path d="M700 240 C880 235 1010 250 1090 260"/>
    <path d="M640 500 C640 510 640 520 640 530"/>
  </g>

  <!-- Eye Flow Labels -->
  <g class="small">
    <!-- Left arrow -->
    <text x="120" y="252" fill="#12C6B2">1. KPIs</text>

    <!-- Moved away from arrowhead -->
    <text x="445" y="266" fill="#12C6B2">2. Main Chart</text>

    <!-- Shifted left from the arrow tip -->
    <text x="990" y="238" fill="#12C6B2">3. Breakdown</text>

    <!-- Moved above the vertical arrow -->
    <text x="628" y="492" text-anchor="middle" fill="#12C6B2">4. Trend</text>
  </g>

  <!-- Bottom Rule -->
  <line x1="50" y1="720" x2="1350" y2="720" stroke="#12C6B2" stroke-width="3"/>
  <text x="50" y="752" class="small">Design Rule: Users should understand the dashboard within five seconds.</text>

</svg>

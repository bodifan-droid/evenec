<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="520"
     viewBox="0 0 1400 520">

  <defs>

    <style>
      .title{
        font-family:Inter,Segoe UI,Arial,sans-serif;
        font-size:42px;
        font-weight:700;
        fill:#1E3A8A;
      }

      .subtitle{
        font-family:Inter,Segoe UI,Arial,sans-serif;
        font-size:22px;
        font-weight:700;
        fill:#12C6B2;
      }

      .step{
        font-family:Inter,Segoe UI,Arial,sans-serif;
        font-size:24px;
        font-weight:700;
        fill:#1E3A8A;
      }

      .desc{
        font-family:Inter,Segoe UI,Arial,sans-serif;
        font-size:16px;
        fill:#1E3A8A;
      }

      .num{
        font-family:Inter,Segoe UI,Arial,sans-serif;
        font-size:18px;
        font-weight:700;
        fill:white;
      }
    </style>

    <marker id="arrow"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto">

      <path d="M0,0 L12,6 L0,12 Z"
            fill="#12C6B2"/>
    </marker>

  </defs>

  <!-- Background -->

  <rect width="1400"
        height="520"
        rx="28"
        fill="white"/>

  <!-- Header -->

  <text x="60"
        y="70"
        class="subtitle">SQL-01</text>

  <text x="60"
        y="120"
        class="title">SQL Execution Order</text>

  <!-- Flow -->

  <g transform="translate(55,210)">

    <!-- FROM -->

    <g transform="translate(0,0)">

      <circle cx="60"
              cy="-35"
              r="18"
              fill="#12C6B2"/>

      <text x="60"
            y="-28"
            text-anchor="middle"
            class="num">1</text>

      <rect x="0"
            y="0"
            width="120"
            height="120"
            rx="18"
            fill="white"
            stroke="#D6DCE8"
            stroke-width="2"/>

      <rect x="32"
            y="28"
            width="56"
            height="40"
            rx="4"
            fill="none"
            stroke="#1E3A8A"
            stroke-width="3"/>

      <line x1="32" y1="42" x2="88" y2="42"
            stroke="#1E3A8A" stroke-width="3"/>

      <line x1="50" y1="28" x2="50" y2="68"
            stroke="#1E3A8A" stroke-width="3"/>

      <line x1="70" y1="28" x2="70" y2="68"
            stroke="#1E3A8A" stroke-width="3"/>

      <text x="60" y="96"
            text-anchor="middle"
            class="step">FROM</text>

      <text x="60" y="140"
            text-anchor="middle"
            class="desc">Choose tables</text>

    </g>

    <!-- WHERE -->

    <line x1="130" y1="60" x2="170" y2="60"
          stroke="#12C6B2"
          stroke-width="3"
          marker-end="url(#arrow)"/>

    <g transform="translate(170,0)">

      <circle cx="60" cy="-35" r="18" fill="#12C6B2"/>

      <text x="60" y="-28"
            text-anchor="middle"
            class="num">2</text>

      <rect x="0" y="0" width="120" height="120"
            rx="18"
            fill="white"
            stroke="#D6DCE8"
            stroke-width="2"/>

      <path d="M35 30 L85 30 L62 58 L62 76"
            fill="none"
            stroke="#1E3A8A"
            stroke-width="3"/>

      <text x="60" y="96"
            text-anchor="middle"
            class="step">WHERE</text>

      <text x="60" y="140"
            text-anchor="middle"
            class="desc">Filter rows</text>

    </g>

    <!-- GROUP BY -->

    <line x1="300" y1="60" x2="340" y2="60"
          stroke="#12C6B2"
          stroke-width="3"
          marker-end="url(#arrow)"/>

    <g transform="translate(340,0)">

      <circle cx="60" cy="-35" r="18" fill="#12C6B2"/>

      <text x="60" y="-28"
            text-anchor="middle"
            class="num">3</text>

      <rect x="0" y="0" width="120" height="120"
            rx="18"
            fill="white"
            stroke="#D6DCE8"
            stroke-width="2"/>

      <circle cx="42" cy="42" r="10"
              fill="none"
              stroke="#1E3A8A"
              stroke-width="3"/>

      <circle cx="78" cy="42" r="10"
              fill="none"
              stroke="#1E3A8A"
              stroke-width="3"/>

      <circle cx="60" cy="68" r="10"
              fill="none"
              stroke="#1E3A8A"
              stroke-width="3"/>

      <text x="60" y="96"
            text-anchor="middle"
            class="step">GROUP BY</text>

      <text x="60" y="140"
            text-anchor="middle"
            class="desc">Create groups</text>

    </g>

    <!-- HAVING -->

    <line x1="470" y1="60" x2="510" y2="60"
          stroke="#12C6B2"
          stroke-width="3"
          marker-end="url(#arrow)"/>

    <g transform="translate(510,0)">

      <circle cx="60" cy="-35" r="18" fill="#12C6B2"/>

      <text x="60" y="-28"
            text-anchor="middle"
            class="num">4</text>

      <rect x="0" y="0" width="120" height="120"
            rx="18"
            fill="white"
            stroke="#D6DCE8"
            stroke-width="2"/>

      <circle cx="60" cy="46" r="18"
              fill="none"
              stroke="#1E3A8A"
              stroke-width="3"/>

      <path d="M48 46 L57 55 L73 38"
            fill="none"
            stroke="#12C6B2"
            stroke-width="3"/>

      <text x="60" y="96"
            text-anchor="middle"
            class="step">HAVING</text>

      <text x="60" y="140"
            text-anchor="middle"
            class="desc">Filter groups</text>

    </g>

    <!-- SELECT -->

    <line x1="640" y1="60" x2="680" y2="60"
          stroke="#12C6B2"
          stroke-width="3"
          marker-end="url(#arrow)"/>

    <g transform="translate(680,0)">

      <circle cx="60" cy="-35" r="18" fill="#12C6B2"/>

      <text x="60" y="-28"
            text-anchor="middle"
            class="num">5</text>

      <rect x="0" y="0" width="120" height="120"
            rx="18"
            fill="white"
            stroke="#D6DCE8"
            stroke-width="2"/>

      <line x1="35" y1="34" x2="85" y2="34"
            stroke="#1E3A8A"
            stroke-width="3"/>

      <line x1="35" y1="52" x2="85" y2="52"
            stroke="#1E3A8A"
            stroke-width="3"/>

      <line x1="35" y1="70" x2="70" y2="70"
            stroke="#1E3A8A"
            stroke-width="3"/>

      <text x="60" y="96"
            text-anchor="middle"
            class="step">SELECT</text>

      <text x="60" y="140"
            text-anchor="middle"
            class="desc">Pick columns</text>

    </g>

    <!-- ORDER BY -->

    <line x1="810" y1="60" x2="850" y2="60"
          stroke="#12C6B2"
          stroke-width="3"
          marker-end="url(#arrow)"/>

    <g transform="translate(850,0)">

      <circle cx="60" cy="-35" r="18" fill="#12C6B2"/>

      <text x="60" y="-28"
            text-anchor="middle"
            class="num">6</text>

      <rect x="0" y="0" width="120" height="120"
            rx="18"
            fill="white"
            stroke="#D6DCE8"
            stroke-width="2"/>

      <line x1="40" y1="34" x2="40" y2="72"
            stroke="#1E3A8A"
            stroke-width="3"/>

      <line x1="60" y1="34" x2="60" y2="62"
            stroke="#1E3A8A"
            stroke-width="3"/>

      <line x1="80" y1="34" x2="80" y2="52"
            stroke="#1E3A8A"
            stroke-width="3"/>

      <path d="M30 78 L40 88 L50 78"
            fill="none"
            stroke="#12C6B2"
            stroke-width="3"/>

      <text x="60" y="96"
            text-anchor="middle"
            class="step">ORDER BY</text>

      <text x="60" y="140"
            text-anchor="middle"
            class="desc">Sort results</text>

    </g>

    <!-- LIMIT -->

    <line x1="980" y1="60" x2="1020" y2="60"
          stroke="#12C6B2"
          stroke-width="3"
          marker-end="url(#arrow)"/>

    <g transform="translate(1020,0)">

      <circle cx="60" cy="-35" r="18" fill="#12C6B2"/>

      <text x="60" y="-28"
            text-anchor="middle"
            class="num">7</text>

      <rect x="0" y="0" width="120" height="120"
            rx="18"
            fill="white"
            stroke="#D6DCE8"
            stroke-width="2"/>

      <path d="M38 60 L82 60 M62 40 L82 60 L62 80"
            fill="none"
            stroke="#1E3A8A"
            stroke-width="3"/>

      <text x="60" y="96"
            text-anchor="middle"
            class="step">LIMIT</text>

      <text x="60" y="140"
            text-anchor="middle"
            class="desc">Return rows</text>

    </g>

  </g>

</svg>
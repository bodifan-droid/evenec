<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="788"
     viewBox="0 0 1400 788">

  <defs>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:700;fill:#1E3A8A;}
      .subtitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:22px;font-weight:700;fill:#12C6B2;}
      .cardTitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:21px;font-weight:700;fill:#1E3A8A;}
      .body{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px;fill:#1E3A8A;}
      .icon{font-family:Inter,Segoe UI Symbol,Segoe UI Emoji,Arial,sans-serif;font-size:22px;font-weight:700;fill:#1E3A8A;}
      .footer{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:16px;fill:#475569;}
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="788" rx="28" fill="white"/>

  <!-- Header -->
  <text x="60" y="70" class="subtitle">HR-04</text>
  <text x="60" y="120" class="title">Interview Confidence Journey</text>

  <!-- Progress line -->
  <line x1="110" y1="270" x2="1290" y2="270"
        stroke="#12C6B2"
        stroke-width="8"
        stroke-linecap="round"/>

  <!-- Milestone 1 -->
  <g transform="translate(110,270)">
    <circle r="34" fill="#12C6B2"/>
    <text text-anchor="middle" dominant-baseline="middle" class="icon">📖</text>

    <rect x="-70" y="55" width="140" height="90" rx="18"
          fill="white" stroke="#D6DCE8" stroke-width="2"/>
    <text x="0" y="92" text-anchor="middle" class="cardTitle">Prepare</text>
    <text x="0" y="118" text-anchor="middle" class="body">Know your stories</text>
  </g>

  <!-- Milestone 2 -->
  <g transform="translate(390,270)">
    <circle r="34" fill="#12C6B2"/>
    <text text-anchor="middle" dominant-baseline="middle" class="icon">🧩</text>

    <rect x="-70" y="55" width="140" height="90" rx="18"
          fill="white" stroke="#D6DCE8" stroke-width="2"/>
    <text x="0" y="92" text-anchor="middle" class="cardTitle">Structure</text>
    <text x="0" y="118" text-anchor="middle" class="body">Use STAR clearly</text>
  </g>

  <!-- Milestone 3 -->
  <g transform="translate(670,270)">
    <circle r="34" fill="#12C6B2"/>
    <text text-anchor="middle" dominant-baseline="middle" class="icon">💬</text>

    <rect x="-70" y="55" width="140" height="90" rx="18"
          fill="white" stroke="#D6DCE8" stroke-width="2"/>
    <text x="0" y="92" text-anchor="middle" class="cardTitle">Communicate</text>
    <text x="0" y="118" text-anchor="middle" class="body">Speak naturally</text>
  </g>

  <!-- Milestone 4 -->
  <g transform="translate(950,270)">
    <circle r="34" fill="#12C6B2"/>
    <text text-anchor="middle" dominant-baseline="middle" class="icon">🤝</text>

    <rect x="-70" y="55" width="140" height="90" rx="18"
          fill="white" stroke="#D6DCE8" stroke-width="2"/>
    <text x="0" y="92" text-anchor="middle" class="cardTitle">Build Trust</text>
    <text x="0" y="118" text-anchor="middle" class="body">Show reliability</text>
  </g>

  <!-- Milestone 5 -->
  <g transform="translate(1230,270)">
    <circle r="34" fill="#12C6B2"/>
    <text text-anchor="middle" dominant-baseline="middle" class="icon">✓</text>

    <rect x="-82" y="42" width="164" height="118" rx="20"
          fill="#F8FFFD" stroke="#12C6B2" stroke-width="3"/>

    <circle cx="56" cy="22" r="15"
            fill="white" stroke="#12C6B2" stroke-width="3"/>
    <path d="M49 22 L54 27 L63 17"
          fill="none" stroke="#12C6B2" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>

    <text x="0" y="86" text-anchor="middle" class="cardTitle">Job Offer</text>
    <text x="0" y="112" text-anchor="middle" class="body">Confidence wins</text>
  </g>

  <!-- Journey labels -->
  <g class="footer">
    <text x="110" y="215" text-anchor="middle">Start</text>
    <text x="390" y="215" text-anchor="middle">Organise</text>
    <text x="670" y="215" text-anchor="middle">Explain</text>
    <text x="950" y="215" text-anchor="middle">Earn Trust</text>
    <text x="1230" y="215" text-anchor="middle">Success</text>
  </g>

  <!-- Bottom divider -->
  <line x1="90" y1="705" x2="1310" y2="705"
        stroke="#12C6B2"
        stroke-width="4"
        stroke-linecap="round"/>

  <text x="700" y="742"
        text-anchor="middle"
        class="footer">
    Preparation • Structure • Communication • Trust • Growth
  </text>

</svg>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="788"
     viewBox="0 0 1400 788">

  <defs>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:700;fill:#1E3A8A;}
      .subtitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:22px;font-weight:700;fill:#12C6B2;}
      .step{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:22px;font-weight:700;fill:#1E3A8A;}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px;fill:#1E3A8A;}
      .num{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:700;fill:white;}
    </style>

    <marker id="arrow"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#12C6B2"/>
    </marker>

  </defs>

  <rect width="1400" height="788" rx="28" fill="white"/>

  <text x="60" y="70" class="subtitle">HR-04</text>
  <text x="60" y="120" class="title">Interview Confidence Ladder</text>

  <g transform="translate(40,170)">

    <!-- Step 1 -->

    <g transform="translate(0,390)">
      <circle cx="35" cy="-22" r="18" fill="#12C6B2"/>
      <text x="35" y="-15" text-anchor="middle" class="num">1</text>

      <rect width="220" height="90" rx="18"
            fill="white"
            stroke="#D6DCE8"
            stroke-width="2"/>

      <text x="110" y="38" text-anchor="middle" class="step">Prepare</text>
      <text x="110" y="64" text-anchor="middle" class="small">Know your stories</text>
    </g>

    <!-- Arrow -->

    <line x1="220" y1="420" x2="290" y2="340"
          stroke="#12C6B2"
          stroke-width="3"
          marker-end="url(#arrow)"/>

    <!-- Step 2 -->

    <g transform="translate(280,300)">
      <circle cx="35" cy="-22" r="18" fill="#12C6B2"/>
      <text x="35" y="-15" text-anchor="middle" class="num">2</text>

      <rect width="220" height="90" rx="18"
            fill="white"
            stroke="#D6DCE8"
            stroke-width="2"/>

      <text x="110" y="38" text-anchor="middle" class="step">Structure</text>
      <text x="110" y="64" text-anchor="middle" class="small">Use STAR clearly</text>
    </g>

    <line x1="500" y1="330" x2="570" y2="250"
          stroke="#12C6B2"
          stroke-width="3"
          marker-end="url(#arrow)"/>

    <!-- Step 3 -->

    <g transform="translate(560,210)">
      <circle cx="35" cy="-22" r="18" fill="#12C6B2"/>
      <text x="35" y="-15" text-anchor="middle" class="num">3</text>

      <rect width="220" height="90" rx="18"
            fill="white"
            stroke="#D6DCE8"
            stroke-width="2"/>

      <text x="110" y="38" text-anchor="middle" class="step">Communicate</text>
      <text x="110" y="64" text-anchor="middle" class="small">Speak naturally</text>
    </g>

    <line x1="780" y1="240" x2="850" y2="160"
          stroke="#12C6B2"
          stroke-width="3"
          marker-end="url(#arrow)"/>

    <!-- Step 4 -->

    <g transform="translate(840,120)">
      <circle cx="35" cy="-22" r="18" fill="#12C6B2"/>
      <text x="35" y="-15" text-anchor="middle" class="num">4</text>

      <rect width="220" height="90" rx="18"
            fill="white"
            stroke="#D6DCE8"
            stroke-width="2"/>

      <text x="110" y="38" text-anchor="middle" class="step">Build Trust</text>
      <text x="110" y="64" text-anchor="middle" class="small">Show reliability</text>
    </g>

    <line x1="1060" y1="150" x2="1130" y2="70"
          stroke="#12C6B2"
          stroke-width="3"
          marker-end="url(#arrow)"/>

    <!-- Step 5 -->

    <g transform="translate(1120,30)">
      <circle cx="35" cy="-22" r="18" fill="#12C6B2"/>
      <text x="35" y="-15" text-anchor="middle" class="num">5</text>

      <rect width="220" height="90" rx="18"
            fill="white"
            stroke="#D6DCE8"
            stroke-width="2"/>

      <text x="110" y="38" text-anchor="middle" class="step">Job Offer</text>
      <text x="110" y="64" text-anchor="middle" class="small">Confidence wins</text>

      <!-- Evenec check -->

      <circle cx="180" cy="24" r="16"
              fill="white"
              stroke="#12C6B2"
              stroke-width="3"/>

      <path d="M171 24 L178 31 L191 18"
            fill="none"
            stroke="#12C6B2"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"/>

    </g>

  </g>

  <!-- Footer -->

  <g transform="translate(40,700)">

    <line x1="0" y1="0" x2="1120" y2="0"
          stroke="#12C6B2"
          stroke-width="3"
          stroke-linecap="round"/>

    <text x="560" y="34"
          text-anchor="middle"
          class="small">Preparation • Structure • Communication • Trust • Growth</text>

  </g>

</svg>
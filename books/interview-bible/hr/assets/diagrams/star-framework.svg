<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="760"
     viewBox="0 0 1200 760">

  <defs>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:48px;font-weight:700;fill:#1E3A8A;}
      .chapter{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:22px;font-weight:700;fill:#12C6B2;}
      .cardTitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:700;fill:#1E3A8A;}
      .body{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:16px;fill:#334155;}
      .letter{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:34px;font-weight:700;fill:#1E3A8A;}
    </style>

    <marker id="arrow" markerWidth="12" markerHeight="12"
            refX="10" refY="6" orient="auto">
      <path d="M0,0 L10,6 L0,12 Z" fill="#12C6B2"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="28" fill="#F8FAFC"/>

  <!-- Header -->
  <text x="55" y="65" class="chapter">HR-02</text>
  <text x="55" y="112" class="title">STAR Framework</text>

  <!-- Geometry -->
  <!-- Card width = 190 -->
  <!-- Card centres: 145, 385, 625, 865 -->

  <!-- Connecting arrows -->
  <g stroke="#12C6B2"
     stroke-width="4"
     fill="none"
     marker-end="url(#arrow)">
    <line x1="181" y1="175" x2="329" y2="175"/>
    <line x1="421" y1="175" x2="569" y2="175"/>
    <line x1="661" y1="175" x2="809" y2="175"/>
  </g>

  <!-- Vertical arrows -->
  <g fill="#12C6B2">
    <path d="M145 206 L160 206 L145 238 L130 206 Z"/>
    <path d="M385 206 L400 206 L385 238 L370 206 Z"/>
    <path d="M625 206 L640 206 L625 238 L610 206 Z"/>
    <path d="M865 206 L880 206 L865 238 L850 206 Z"/>
  </g>

  <!-- Circles -->
  <g fill="#ECFEFB" stroke="#12C6B2" stroke-width="3">
    <circle cx="145" cy="175" r="32"/>
    <circle cx="385" cy="175" r="32"/>
    <circle cx="625" cy="175" r="32"/>
    <circle cx="865" cy="175" r="32"/>
  </g>

  <!-- Letters -->
  <g text-anchor="middle" dominant-baseline="middle" class="letter">
    <text x="145" y="175">S</text>
    <text x="385" y="175">T</text>
    <text x="625" y="175">A</text>
    <text x="865" y="175">R</text>
  </g>

  <!-- Cards -->
  <g>
    <!-- Situation -->
    <g transform="translate(50,260)">
      <rect x="4" y="4" width="190" height="270" rx="20"
            fill="#0F172A" opacity="0.08"/>
      <rect width="190" height="270" rx="20"
            fill="white" stroke="#CBD5E1" stroke-width="2"/>
      <text x="95" y="40" text-anchor="middle" class="cardTitle">Situation</text>
      <text x="30" y="82" class="body">Set the context.</text>
      <text x="30" y="114" class="body">What was the</text>
      <text x="30" y="146" class="body">situation?</text>
    </g>

    <!-- Task -->
    <g transform="translate(290,260)">
      <rect x="4" y="4" width="190" height="270" rx="20"
            fill="#0F172A" opacity="0.08"/>
      <rect width="190" height="270" rx="20"
            fill="white" stroke="#CBD5E1" stroke-width="2"/>
      <text x="95" y="40" text-anchor="middle" class="cardTitle">Task</text>
      <text x="30" y="82" class="body">What was your</text>
      <text x="30" y="114" class="body">responsibility?</text>
      <text x="30" y="146" class="body">What needed</text>
      <text x="30" y="178" class="body">to be done?</text>
    </g>

    <!-- Action -->
    <g transform="translate(530,260)">
      <rect x="4" y="4" width="190" height="270" rx="20"
            fill="#0F172A" opacity="0.08"/>
      <rect width="190" height="270" rx="20"
            fill="white" stroke="#CBD5E1" stroke-width="2"/>
      <text x="95" y="40" text-anchor="middle" class="cardTitle">Action</text>
      <text x="30" y="82" class="body">What actions</text>
      <text x="30" y="114" class="body">did you take?</text>
      <text x="30" y="146" class="body">What was your</text>
      <text x="30" y="178" class="body">approach?</text>
    </g>

    <!-- Result -->
    <g transform="translate(770,260)">
      <rect x="4" y="4" width="190" height="270" rx="20"
            fill="#0F172A" opacity="0.08"/>
      <rect width="190" height="270" rx="20"
            fill="white" stroke="#CBD5E1" stroke-width="2"/>
      <text x="95" y="40" text-anchor="middle" class="cardTitle">Result</text>
      <text x="30" y="82" class="body">What was the</text>
      <text x="30" y="114" class="body">outcome?</text>
      <text x="30" y="146" class="body">What impact</text>
      <text x="30" y="178" class="body">did you create?</text>
    </g>
  </g>

</svg>
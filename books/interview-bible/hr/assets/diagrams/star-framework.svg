<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="720"
     viewBox="0 0 1200 720">

  <defs>
    <style>
      .title{
        font-family:Inter,Segoe UI,Arial,sans-serif;
        font-size:42px;
        font-weight:700;
        fill:#1E3A8A;
      }
      .subtitle{
        font-family:Inter,Segoe UI,Arial,sans-serif;
        font-size:22px;
        font-weight:600;
        fill:#12C6B2;
      }
      .letter{
        font-family:Inter,Segoe UI,Arial,sans-serif;
        font-size:42px;
        font-weight:700;
        fill:#1E3A8A;
      }
      .cardTitle{
        font-family:Inter,Segoe UI,Arial,sans-serif;
        font-size:22px;
        font-weight:700;
        fill:#1E3A8A;
      }
      .body{
        font-family:Inter,Segoe UI,Arial,sans-serif;
        font-size:17px;
        fill:#1E3A8A;
      }
    </style>

    <marker id="arrow"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#12C6B2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" rx="28" fill="white"/>

  <!-- Header -->
  <text x="60" y="70" class="subtitle">HR-02</text>
  <text x="60" y="120" class="title">STAR Framework</text>

  <!-- Top circles -->
  <g transform="translate(210,185)">
    <circle cx="0" cy="0" r="36" fill="white" stroke="#12C6B2" stroke-width="3"/>
    <text x="0" y="13" text-anchor="middle" class="letter">S</text>

    <circle cx="200" cy="0" r="36" fill="white" stroke="#12C6B2" stroke-width="3"/>
    <text x="200" y="13" text-anchor="middle" class="letter">T</text>

    <circle cx="400" cy="0" r="36" fill="white" stroke="#12C6B2" stroke-width="3"/>
    <text x="400" y="13" text-anchor="middle" class="letter">A</text>

    <circle cx="600" cy="0" r="36" fill="white" stroke="#12C6B2" stroke-width="3"/>
    <text x="600" y="13" text-anchor="middle" class="letter">R</text>

    <!-- Horizontal arrows -->
    <line x1="40" y1="0" x2="160" y2="0" stroke="#12C6B2" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="240" y1="0" x2="360" y2="0" stroke="#12C6B2" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="440" y1="0" x2="560" y2="0" stroke="#12C6B2" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Vertical arrows -->
    <line x1="0" y1="36" x2="0" y2="78" stroke="#12C6B2" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="200" y1="36" x2="200" y2="78" stroke="#12C6B2" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="400" y1="36" x2="400" y2="78" stroke="#12C6B2" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="600" y1="36" x2="600" y2="78" stroke="#12C6B2" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <!-- Cards -->
  <g transform="translate(110,290)">

    <!-- Situation -->
    <rect x="0" y="0" width="180" height="250" rx="18" fill="white" stroke="#D6DCE8" stroke-width="2"/>
    <text x="90" y="42" text-anchor="middle" class="cardTitle">Situation</text>
    <text x="30" y="86" class="body">Set the context.</text>
    <text x="30" y="116" class="body">What was the</text>
    <text x="30" y="146" class="body">situation?</text>

    <!-- Task -->
    <rect x="240" y="0" width="180" height="250" rx="18" fill="white" stroke="#D6DCE8" stroke-width="2"/>
    <text x="330" y="42" text-anchor="middle" class="cardTitle">Task</text>
    <text x="270" y="86" class="body">What was your</text>
    <text x="270" y="116" class="body">responsibility?</text>
    <text x="270" y="146" class="body">What needed</text>
    <text x="270" y="176" class="body">to be done?</text>

    <!-- Action -->
    <rect x="480" y="0" width="180" height="250" rx="18" fill="white" stroke="#D6DCE8" stroke-width="2"/>
    <text x="570" y="42" text-anchor="middle" class="cardTitle">Action</text>
    <text x="510" y="86" class="body">What actions</text>
    <text x="510" y="116" class="body">did you take?</text>
    <text x="510" y="146" class="body">What was your</text>
    <text x="510" y="176" class="body">approach?</text>

    <!-- Result -->
    <rect x="720" y="0" width="180" height="250" rx="18" fill="white" stroke="#D6DCE8" stroke-width="2"/>
    <text x="810" y="42" text-anchor="middle" class="cardTitle">Result</text>
    <text x="750" y="86" class="body">What was the</text>
    <text x="750" y="116" class="body">outcome?</text>
    <text x="750" y="146" class="body">What impact</text>
    <text x="750" y="176" class="body">did you create?</text>

  </g>

</svg>
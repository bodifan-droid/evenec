project:
  type: book
  output-dir: _book
  resources:
    - ../../assets/**
    - ../../templates/**
    - data-analyst-interview-bible-uk-2026.pdf
    - data-analyst-interview-bible-uk-2026.epub

book:
  title: "Data Analyst Interview Bible (UK 2026)"
  favicon: assets/logo/evenec-icon.svg
  subtitle: "UK Interview Edition"
  author:
    - "Bohdan Shevchuk"
    - "ChatGPT (OpenAI)"
  date: "First Edition"

  sidebar:
    style: docked
    search: true
    logo: assets/logo/evenec-logo.png

  chapters:
    - index.qmd
    - manifesto.md
    - copyright.md
    - foreword.md

    - part: "Part I — HR Interview Mastery"
      chapters:
        - hr/hr-01.md
        - hr/hr-02.md
        - hr/hr-03.md
        - hr/hr-04.md

    - part: "Part II — SQL Bible"
      chapters:
        - sql/sql-01.md
        - sql/sql-02.md
        - sql/sql-03.md
        - sql/sql-04.md
  
    - part: "Part III — Excel Interview Bible"
      chapters:
        - excel/excel-01.md
        - excel/excel-02.md
        - excel/excel-03.md
        - excel/excel-04.md
    
    - part: "Part IV — Power BI Interview Bible"
      chapters:
        - powerbi/powerbi-01.md
        - powerbi/powerbi-02.md
        - powerbi/powerbi-03.md
        - powerbi/powerbi-04.md

    - cheatsheets.md
    - changelog.md

format:
  html:
    include-after-body:
      - templates/footer.html
    theme:
      - cosmo
    toc: true
    toc-depth: 2
    number-sections: false

  pdf:
    documentclass: scrbook
    toc: true
    number-sections: true

  epub:
    toc: true
    cover-image: assets/cover-v1.png

  typst:
    toc: true
    toc-depth: 2
    number-sections: false
    papersize: a4
    margin:
      x: 20mm
      y: 22mm
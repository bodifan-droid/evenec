project:
  type: book
  output-dir: _book
  resources:
    - ../../assets/**
    - ../../templates/**

book:
  title: "Data Analyst Interview Bible (UK 2026)"
  subtitle: "UK Interview Edition"
  author:
    - "Bohdan Shevchuk"
    - "ChatGPT (OpenAI)"
  date: "First Edition"

  chapters:
    - index.qmd
    - copyright.md
    - foreword.md

    - part: "Part I — HR Interview Mastery"
      chapters:
        - hr/hr-01.md
        - hr/hr-02.md
        - hr/hr-03.md
        - hr/hr-04.md

    - part: "Part II — SQL Bible"
      chapters:
        - sql/sql-01.md
        - sql/sql-02.md
        - sql/sql-03.md
        - sql/sql-04.md
  
    - part: "Part III — Excel Interview Bible"
      chapters:
        - excel/excel-01.md
        - excel/excel-02.md
        - excel/excel-03.md
        - excel/excel-04.md
    
    - part: "Part IV — Power BI Interview Bible"
      chapters:
        - powerbi/powerbi-01.md
        - powerbi/powerbi-02.md
        - powerbi/powerbi-03.md
        - powerbi/powerbi-04.md

    - cheatsheets.md
    - changelog.md

format:
  html:
    theme:
      - cosmo
      - ../../templates/evenec-theme/evenec.scss
    toc: true
    number-sections: true

  typst:
    toc: true
    number-sections: true
    papersize: a4
    margin:
      x: 20mm
      y: 22mm
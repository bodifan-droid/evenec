<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="788"
     viewBox="0 0 1400 788">

  <defs>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:700;fill:#1E3A8A;}
      .subtitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;fill:#475569;}
      .boxTitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;font-weight:700;fill:#1E3A8A;}
      .field{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;fill:#475569;}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px;font-weight:700;fill:#12C6B2;}
      .footer{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;fill:#64748B;}
    </style>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#12C6B2"/>
    </marker>
  </defs>

  <rect width="1400" height="788" rx="28" fill="#F8FAFC"/>

  <!-- Header -->
  <text x="50" y="60" class="title">Power BI Relationship Map</text>
  <text x="50" y="92" class="subtitle">Retail Star Schema</text>
  <line x1="50" y1="112" x2="1350" y2="112" stroke="#12C6B2" stroke-width="3"/>

  <!-- customers -->
  <g transform="translate(60,190)">
    <rect x="4" y="4" width="240" height="210" rx="18" fill="#0F172A" opacity="0.08"/>
    <rect width="240" height="210" rx="18" fill="white"/>
    <text x="24" y="36" class="boxTitle">customers</text>
    <line x1="20" y1="48" x2="220" y2="48" stroke="#E5E7EB"/>
    <text x="24" y="76" class="field">🔑 customer_id</text>
    <text x="24" y="104" class="field">first_name</text>
    <text x="24" y="132" class="field">last_name</text>
    <text x="24" y="160" class="field">city</text>
    <text x="24" y="188" class="field">signup_date</text>
  </g>

  <!-- orders -->
  <g transform="translate(430,150)">
    <rect x="4" y="4" width="270" height="290" rx="18" fill="#0F172A" opacity="0.08"/>
    <rect width="270" height="290" rx="18" fill="white"/>
    <text x="24" y="36" class="boxTitle">orders</text>
    <line x1="20" y1="48" x2="250" y2="48" stroke="#E5E7EB"/>
    <text x="24" y="76" class="field">🔑 order_id</text>
    <text x="24" y="104" class="field">customer_id</text>
    <text x="24" y="132" class="field">order_date</text>
    <text x="24" y="160" class="field">amount</text>
    <text x="24" y="188" class="field">status</text>
    <text x="24" y="216" class="field">payment_id</text>
    <text x="24" y="244" class="field">employee_id</text>
  </g>

  <!-- order_items -->
  <g transform="translate(830,150)">
    <rect x="4" y="4" width="270" height="290" rx="18" fill="#0F172A" opacity="0.08"/>
    <rect width="270" height="290" rx="18" fill="white"/>
    <text x="24" y="36" class="boxTitle">order_items</text>
    <line x1="20" y1="48" x2="250" y2="48" stroke="#E5E7EB"/>
    <text x="24" y="76" class="field">order_item_id</text>
    <text x="24" y="104" class="field">order_id</text>
    <text x="24" y="132" class="field">product_id</text>
    <text x="24" y="160" class="field">quantity</text>
    <text x="24" y="188" class="field">unit_price</text>
  </g>

  <!-- products -->
  <g transform="translate(1130,190)">
    <rect x="4" y="4" width="220" height="210" rx="18" fill="#0F172A" opacity="0.08"/>
    <rect width="220" height="210" rx="18" fill="white"/>
    <text x="24" y="36" class="boxTitle">products</text>
    <line x1="20" y1="48" x2="200" y2="48" stroke="#E5E7EB"/>
    <text x="24" y="76" class="field">🔑 product_id</text>
    <text x="24" y="104" class="field">product_name</text>
    <text x="24" y="132" class="field">category</text>
    <text x="24" y="160" class="field">price</text>
  </g>

  <!-- payments -->
  <g transform="translate(450,520)">
    <rect x="4" y="4" width="210" height="150" rx="18" fill="#0F172A" opacity="0.08"/>
    <rect width="210" height="150" rx="18" fill="white"/>
    <text x="24" y="36" class="boxTitle">payments</text>
    <line x1="20" y1="48" x2="190" y2="48" stroke="#E5E7EB"/>
    <text x="24" y="76" class="field">payment_id</text>
    <text x="24" y="104" class="field">method</text>
    <text x="24" y="132" class="field">status</text>
  </g>

  <!-- employees -->
  <g transform="translate(820,520)">
    <rect x="4" y="4" width="210" height="150" rx="18" fill="#0F172A" opacity="0.08"/>
    <rect width="210" height="150" rx="18" fill="white"/>
    <text x="24" y="36" class="boxTitle">employees</text>
    <line x1="20" y1="48" x2="190" y2="48" stroke="#E5E7EB"/>
    <text x="24" y="76" class="field">employee_id</text>
    <text x="24" y="104" class="field">name</text>
    <text x="24" y="132" class="field">department</text>
  </g>

  <!-- Relationships -->
  <g stroke="#12C6B2" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <!-- customers -> orders -->
    <line x1="300" y1="295" x2="430" y2="295"/>

    <!-- orders -> order_items -->
    <line x1="700" y1="295" x2="830" y2="295"/>

    <!-- order_items -> products -->
    <line x1="1100" y1="295" x2="1130" y2="295"/>

    <!-- orders -> payments -->
    <line x1="565" y1="440" x2="565" y2="520"/>

    <!-- order_items -> employees -->
    <line x1="960" y1="440" x2="925" y2="520"/>
  </g>

  <!-- Legend -->
  <g transform="translate(60,705)">
    <rect width="1280" height="48" rx="12" fill="white"/>
    <circle cx="24" cy="24" r="6" fill="#12C6B2"/>
    <text x="40" y="30" class="footer">Relationships allow filters to flow between connected tables in Power BI.</text>
  </g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="788"
     viewBox="0 0 1400 788">

  <defs>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:700;fill:#1E3A8A;}
      .subtitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;fill:#475569;}
      .boxTitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:22px;font-weight:700;fill:#1E3A8A;}
      .body{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:16px;fill:#475569;}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;fill:#64748B;}
    </style>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#00000022"/>
    </filter>

    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#12C6B2"/>
    </marker>

    <linearGradient id="tealGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#12C6B2"/>
      <stop offset="100%" stop-color="#0EA5A4"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="788" rx="28" fill="#F8FAFC"/>

  <!-- Header -->
  <text x="50" y="60" class="title">Power BI — Filter Context</text>
  <text x="50" y="92" class="subtitle">One slicer can update every connected visual automatically.</text>
  <line x1="50" y1="112" x2="1350" y2="112" stroke="#12C6B2" stroke-width="3"/>

  <!-- Slicer -->
  <g filter="url(#shadow)" transform="translate(60,180)">
    <rect width="250" height="430" rx="22" fill="white"/>
    <text x="30" y="42" class="boxTitle">Slicer</text>
    <text x="30" y="68" class="body">City</text>

    <rect x="24" y="90" width="202" height="44" rx="10" fill="#ECFEFB" stroke="#12C6B2" stroke-width="2"/>
    <text x="42" y="117" class="body">✓ London</text>

    <rect x="24" y="150" width="202" height="44" rx="10" fill="white" stroke="#CBD5E1"/>
    <text x="42" y="177" class="body">Manchester</text>

    <rect x="24" y="210" width="202" height="44" rx="10" fill="white" stroke="#CBD5E1"/>
    <text x="42" y="237" class="body">Leeds</text>

    <rect x="24" y="270" width="202" height="44" rx="10" fill="white" stroke="#CBD5E1"/>
    <text x="42" y="297" class="body">Birmingham</text>

    <text x="24" y="352" class="small">Selected filter:</text>
    <text x="24" y="378" class="body" fill="#12C6B2">London</text>
  </g>

  <!-- Main Arrow -->
  <line x1="310" y1="395" x2="470" y2="395" stroke="#12C6B2" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="330" y="372" class="small">Filter travels</text>

  <!-- Model -->
  <g filter="url(#shadow)" transform="translate(470,240)">
    <rect width="260" height="310" rx="22" fill="white"/>
    <text x="34" y="42" class="boxTitle">Data Model</text>

    <rect x="34" y="78" width="82" height="48" rx="8" fill="white" stroke="#CBD5E1"/>
    <text x="75" y="107" text-anchor="middle" class="small">Customers</text>

    <rect x="146" y="78" width="82" height="48" rx="8" fill="#ECFEFB" stroke="#12C6B2" stroke-width="2"/>
    <text x="187" y="107" text-anchor="middle" class="small">Orders</text>

    <rect x="90" y="188" width="82" height="48" rx="8" fill="white" stroke="#CBD5E1"/>
    <text x="131" y="217" text-anchor="middle" class="small">Products</text>

    <line x1="116" y1="102" x2="146" y2="102" stroke="#12C6B2" stroke-width="3"/>
    <line x1="187" y1="126" x2="131" y2="188" stroke="#12C6B2" stroke-width="3"/>

    <text x="34" y="274" class="small">Relationships carry</text>
    <text x="34" y="296" class="small">the filter automatically.</text>
  </g>

  <!-- Arrow to visuals -->
  <line x1="730" y1="395" x2="860" y2="395" stroke="#12C6B2" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- Dashboard -->
  <g filter="url(#shadow)" transform="translate(860,160)">
    <rect width="470" height="470" rx="22" fill="white"/>
    <text x="28" y="40" class="boxTitle">Report Updates</text>

    <!-- KPI -->
    <rect x="28" y="66" width="180" height="78" rx="12" fill="#ECFEFB"/>
    <text x="44" y="92" class="small">Revenue</text>
    <text x="44" y="122" font-family="Inter" font-size="30" font-weight="700" fill="#12C6B2">£456k</text>

    <!-- Bar chart -->
    <rect x="28" y="166" width="240" height="128" rx="12" fill="#F8FAFC"/>
    <text x="40" y="188" class="small">Revenue by Category</text>
    <rect x="52" y="240" width="26" height="34" rx="4" fill="#12C6B2"/>
    <rect x="96" y="212" width="26" height="62" rx="4" fill="#12C6B2"/>
    <rect x="140" y="192" width="26" height="82" rx="4" fill="#12C6B2"/>
    <rect x="184" y="222" width="26" height="52" rx="4" fill="#12C6B2"/>

    <!-- Line chart -->
    <rect x="288" y="166" width="154" height="128" rx="12" fill="#F8FAFC"/>
    <text x="300" y="188" class="small">Monthly Trend</text>
    <polyline points="302,254 322,236 342,240 362,216 382,226 402,206 422,222"
              fill="none" stroke="#12C6B2" stroke-width="4"/>

    <!-- Donut -->
    <rect x="28" y="316" width="180" height="120" rx="12" fill="#F8FAFC"/>
    <text x="40" y="338" class="small">Orders</text>
    <circle cx="118" cy="382" r="30" fill="none" stroke="#1E3A8A" stroke-width="14"/>
    <path d="M118 352 A30 30 0 0 1 145 396"
          fill="none" stroke="#12C6B2" stroke-width="14"/>

    <!-- Active filter -->
    <rect x="228" y="316" width="214" height="120" rx="12" fill="#ECFEFB"/>
    <text x="244" y="342" class="small">Active Filter</text>
    <text x="244" y="374" font-family="Inter" font-size="24" font-weight="700" fill="#1E3A8A">City = London</text>
    <text x="244" y="402" class="small">Every connected visual</text>
    <text x="244" y="422" class="small">shows London only.</text>
  </g>

  <!-- Footer -->
  <line x1="50" y1="720" x2="1350" y2="720" stroke="#12C6B2" stroke-width="3"/>
  <text x="50" y="752" class="small">
    Filter Context changes calculations without rewriting DAX formulas.
  </text>

</svg>